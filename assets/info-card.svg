<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" width="720" height="416" style="background-color: #0d1117; border-radius: 8px; border: 1px solid #30363d; font-family: -apple-system, BlinkMacSystemFont, 'Fira Code', 'Cascadia Code', monospace, sans-serif;">

  <defs>
    <style>
      .title-bar-text { fill: #8b949e; font-size: 11px; font-weight: 600; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      .prompt-user { fill: #58a6ff; font-weight: 600; font-size: 13px; font-family: 'Fira Code', monospace; }
      .prompt-cmd { fill: #39d353; font-weight: 500; font-size: 13px; font-family: 'Fira Code', monospace; }
      .prompt-at { fill: #8b949e; }
      .header-name { fill: #39d353; font-size: 16px; font-weight: 700; font-family: 'Fira Code', monospace; }
      .header-sep { fill: #30363d; }
      .key-text { fill: #58a6ff; font-size: 12px; font-weight: 600; font-family: 'Fira Code', monospace; }
      .val-text { fill: #c9d1d9; font-size: 12px; font-family: 'Fira Code', monospace; }
      .tag-accent { fill: #79c0ff; }
      
      @keyframes fadeInLine {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .anim-row {
        opacity: 0;
        animation: fadeInLine 0.4s ease-out forwards;
      }
    </style>
  </defs>
  <rect x="0" y="0" width="100%" height="32" fill="#161b22" rx="8" />
  <rect x="0" y="24" width="100%" height="8" fill="#161b22" />
  <line x1="0" y1="32" x2="100%" y2="32" stroke="#30363d" stroke-width="1" />
  <circle cx="16" cy="16" r="5" fill="#ff5f56" />
  <circle cx="32" cy="16" r="5" fill="#ffbd2e" />
  <circle cx="48" cy="16" r="5" fill="#27c93f" />
  <text x="360" y="20" text-anchor="middle" class="title-bar-text">vikas3352@dev-station: ~ (neofetch)</text>
  <text x="24" y="58"><tspan class="prompt-user">vikas3352</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-user">station</tspan><tspan class="prompt-at">:~$</tspan> <tspan class="prompt-cmd">neofetch --dev-profile</tspan></text>
  <text x="24" y="82" class="header-name">Vikas Jangid <tspan style="fill:#8b949e; font-size:12px; font-weight:normal;">(@vikas3352)</tspan></text>
  <line x1="24" y1="90" x2="696" y2="90" stroke="#30363d" stroke-width="1" />
  <g class="anim-row" style="animation-delay: 0.1s;"><text x="24" y="116" class="key-text">Host:</text><text x="160" y="116" class="val-text">developer-station (macOS / Linux)</text><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.1s" fill="freeze" /></g>
  <g class="anim-row" style="animation-delay: 0.15s;"><text x="24" y="140" class="key-text">Role:</text><text x="160" y="140" class="val-text">Full Stack Developer • Software Engineer • Backend Developer</text><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.15s" fill="freeze" /></g>
  <g class="anim-row" style="animation-delay: 0.2s;"><text x="24" y="164" class="key-text">Location:</text><text x="160" y="164" class="val-text">India</text><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.2s" fill="freeze" /></g>
  <g class="anim-row" style="animation-delay: 0.25s;"><text x="24" y="188" class="key-text">Languages:</text><text x="160" y="188" class="val-text">TypeScript, JavaScript, Python, SQL, HTML5, CSS3</text><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.25s" fill="freeze" /></g>
  <g class="anim-row" style="animation-delay: 0.3s;"><text x="24" y="212" class="key-text">Frontend:</text><text x="160" y="212" class="val-text">React, Next.js, Redux, Tailwind CSS</text><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.3s" fill="freeze" /></g>
  <g class="anim-row" style="animation-delay: 0.35s;"><text x="24" y="236" class="key-text">Backend:</text><text x="160" y="236" class="val-text">Node.js, Express.js, REST APIs, JWT Authentication</text><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.35s" fill="freeze" /></g>
  <g class="anim-row" style="animation-delay: 0.4s;"><text x="24" y="260" class="key-text">Databases:</text><text x="160" y="260" class="val-text">MongoDB, PostgreSQL, Mongoose</text><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.4s" fill="freeze" /></g>
  <g class="anim-row" style="animation-delay: 0.45s;"><text x="24" y="284" class="key-text">DevOps / CI/CD:</text><text x="160" y="284" class="val-text">GitHub Actions, CI/CD, Docker, Git, Postman, Linux</text><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.45s" fill="freeze" /></g>
  <g class="anim-row" style="animation-delay: 0.5s;"><text x="24" y="308" class="key-text">Featured Work:</text><text x="160" y="308" class="val-text">DebugFlow, InterviewPAL, DWPS Alwar, Zoniraz, Shine Limos</text><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.5s" fill="freeze" /></g>
  <g class="anim-row" style="animation-delay: 0.55s;"><text x="24" y="332" class="key-text">GitHub Stats:</text><text x="160" y="332" class="val-text">605 contributions • 2-day current streak</text><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.55s" fill="freeze" /></g>
  <g class="anim-row" style="animation-delay: 0.6s;"><text x="24" y="356" class="key-text">Uptime:</text><text x="160" y="356" class="val-text">99.98% active coding</text><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.6s" fill="freeze" /></g>
  <!-- Terminal Color Blocks -->
