<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220" style="background-color: #0b0217; border-radius: 10px; border: 1px solid #3d1259; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', sans-serif;">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0217" />
      <stop offset="60%" stop-color="#1f0838" />
      <stop offset="100%" stop-color="#49115b" />
    </linearGradient>

    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffb96" />
      <stop offset="35%" stop-color="#ff71ce" />
      <stop offset="85%" stop-color="#b967ff" />
      <stop offset="100%" stop-color="#01cdfe" />
    </linearGradient>

    <!-- Grid Horizon Glow -->
    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff71ce" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#b967ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0b0217" stop-opacity="0" />
    </linearGradient>

    <!-- Title Glow Filter -->
    <filter id="neonGlowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="7" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect x="0" y="0" width="850" height="220" fill="url(#skyGrad)" />

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="45" r="1.2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="280" cy="30" r="1.5">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="390" cy="60" r="1">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="510" cy="35" r="1.3">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="680" cy="40" r="1.5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Window Bar -->
  <rect x="0" y="0" width="850" height="28" fill="#130424" />
  <line x1="0" y1="28" x2="850" y2="28" stroke="#ff71ce" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="16" cy="14" r="4.5" fill="#ff5f56" />
  <circle cx="30" cy="14" r="4.5" fill="#ffbd2e" />
  <circle cx="44" cy="14" r="4.5" fill="#27c93f" />
  <text x="62" y="18" fill="#a58dbd" font-size="11" font-family="'Fira Code', monospace">vikas3352 / README.md</text>

  <!-- Synthwave Sun (Right Section) -->
  <g transform="translate(680, 115)">
    <!-- Sun disk -->
    <circle cx="0" cy="0" r="54" fill="url(#sunGrad)" filter="url(#sunGlow)" />
    
    <!-- Sun Horizontal Blinds (Classic Synthwave cutouts) -->
    <rect x="-55" y="-6" width="110" height="2" fill="#1f0838" />
    <rect x="-55" y="4" width="110" height="3" fill="#250942" />
    <rect x="-55" y="14" width="110" height="4.5" fill="#2a0a4c" />
    <rect x="-55" y="26" width="110" height="6.5" fill="#300c56" />
    <rect x="-55" y="40" width="110" height="9" fill="#360e60" />
  </g>

  <!-- Distant Mountain Ridge -->
  <polygon points="460,145 520,110 570,135 630,95 710,145" fill="#1c0733" opacity="0.9" />
  <polygon points="620,145 680,105 730,130 790,85 850,145" fill="#160529" opacity="0.9" />

  <!-- Grid Perspective Floor -->
  <g>
    <!-- Horizon Glow -->
    <rect x="0" y="145" width="850" height="75" fill="url(#horizonGlow)" />

    <!-- Horizontal Grid Lines (perspective spaced) -->
    <line x1="0" y1="145" x2="850" y2="145" stroke="#ff71ce" stroke-width="1.8" />
    <line x1="0" y1="152" x2="850" y2="152" stroke="#ff71ce" stroke-width="1.3" stroke-opacity="0.8" />
    <line x1="0" y1="161" x2="850" y2="161" stroke="#ff71ce" stroke-width="1.2" stroke-opacity="0.7" />
    <line x1="0" y1="172" x2="850" y2="172" stroke="#ff71ce" stroke-width="1.4" stroke-opacity="0.6" />
    <line x1="0" y1="187" x2="850" y2="187" stroke="#ff71ce" stroke-width="1.7" stroke-opacity="0.5" />
    <line x1="0" y1="205" x2="850" y2="205" stroke="#ff71ce" stroke-width="2.2" stroke-opacity="0.4" />

    <!-- Perspective Converging Lines to vanishing point (680, 145) -->
    <line x1="680" y1="145" x2="-200" y2="220" stroke="#b967ff" stroke-width="1" stroke-opacity="0.4" />
    <line x1="680" y1="145" x2="0" y2="220" stroke="#b967ff" stroke-width="1" stroke-opacity="0.4" />
    <line x1="680" y1="145" x2="160" y2="220" stroke="#b967ff" stroke-width="1" stroke-opacity="0.5" />
    <line x1="680" y1="145" x2="320" y2="220" stroke="#b967ff" stroke-width="1.1" stroke-opacity="0.5" />
    <line x1="680" y1="145" x2="480" y2="220" stroke="#b967ff" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="680" y1="145" x2="620" y2="220" stroke="#b967ff" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="680" y1="145" x2="740" y2="220" stroke="#b967ff" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="680" y1="145" x2="880" y2="220" stroke="#b967ff" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="680" y1="145" x2="1040" y2="220" stroke="#b967ff" stroke-width="1.1" stroke-opacity="0.5" />
  </g>

  <!-- Left Side: Glowing Developer Title & Identity -->
  <g transform="translate(36, 68)">
    <!-- Small Category Label -->
    <text x="0" y="24" fill="#01cdfe" font-size="12" font-weight="700" letter-spacing="3" font-family="'Courier New', monospace">DEVELOPER // PORTFOLIO</text>
    
    <!-- Main Glowing Name -->
    <text x="0" y="64" fill="#ffffff" font-size="38" font-weight="900" font-family="'Segoe UI', 'Montserrat', sans-serif" letter-spacing="1.5">
      Vikas Jangid
    </text>
    <text x="0" y="64" fill="none" stroke="#ff71ce" stroke-width="2" font-size="38" font-weight="900" font-family="'Segoe UI', 'Montserrat', sans-serif" letter-spacing="1.5" filter="url(#neonGlowPink)">
      Vikas Jangid
    </text>

    <!-- Subtitle Role -->
    <text x="0" y="94" fill="#ffb900" font-size="16" font-weight="700" letter-spacing="2" font-family="'Segoe UI', sans-serif">
      FULL-STACK DEVELOPER &amp; SOFTWARE ENGINEER
    </text>

    <!-- Tech Stack Mini Badges -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="76" height="20" rx="4" fill="#241734" stroke="#ff71ce" stroke-width="1" />
      <text x="38" y="14" fill="#ff71ce" font-size="10.5" font-weight="bold" text-anchor="middle">REACT</text>

      <rect x="84" y="0" width="86" height="20" rx="4" fill="#241734" stroke="#01cdfe" stroke-width="1" />
      <text x="127" y="14" fill="#01cdfe" font-size="10.5" font-weight="bold" text-anchor="middle">NODE.JS</text>

      <rect x="178" y="0" width="102" height="20" rx="4" fill="#241734" stroke="#b967ff" stroke-width="1" />
      <text x="229" y="14" fill="#b967ff" font-size="10.5" font-weight="bold" text-anchor="middle">TYPESCRIPT</text>

      <rect x="288" y="0" width="84" height="20" rx="4" fill="#241734" stroke="#05ffa1" stroke-width="1" />
      <text x="330" y="14" fill="#05ffa1" font-size="10.5" font-weight="bold" text-anchor="middle">MONGODB</text>
    </g>
  </g>
</svg>